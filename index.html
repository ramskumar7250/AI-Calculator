<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Calculator - Every Calculation. One Intelligent Calculator.</title>

    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
        darkMode: 'class',
        theme: {
        extend: {
        fontFamily: {
        sans: ['Inter', 'sans-serif'],
        },
        colors: {
        brand: {
        50: '#f0fdfa',
        100: '#ccfbf1',
        400: '#2dd4bf',
        500: '#14b8a6',
        600: '#0d9488',
        900: '#134e4a',
        },
        dark: {
        bg: '#0a0a0a',
        surface: '#171717',
        border: '#262626'
        }
        },
        animation: {
        'gradient-x': 'gradient-x 3s ease infinite',
        'fade-in-up': 'fadeInUp 0.5s ease-out forwards',
        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
        },
        keyframes: {
        'gradient-x': {
        '0%, 100%': {
        'background-size': '200% 200%',
        'background-position': 'left center'
        },
        '50%': {
        'background-size': '200% 200%',
        'background-position': 'right center'
        },
        },
        fadeInUp: {
        '0%': { opacity: '0', transform: 'translateY(20px)' },
        '100%': { opacity: '1', transform: 'translateY(0)' },
        }
        }
        }
        }
        }
    </script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Math.js for Deterministic Calculation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a0a0a;
            color: #f5f5f5;
        }

        .glass-panel {
            background: rgba(23, 23, 23, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .ai-gradient-text {
            background: linear-gradient(to right, #2dd4bf, #3b82f6, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .ai-gradient-bg {
            background: linear-gradient(135deg, rgba(45,212,191,0.1), rgba(59,130,246,0.1), rgba(168,85,247,0.1));
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0a0a0a;
        }

        ::-webkit-scrollbar-thumb {
            background: #262626;
            border-radius: 4px;
        }

            ::-webkit-scrollbar-thumb:hover {
                background: #404040;
            }

        .loader {
            width: 48px;
            height: 48px;
            border: 3px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            display: inline-block;
            position: relative;
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
        }

            .loader::after {
                content: '';
                box-sizing: border-box;
                position: absolute;
                left: 50%;
                top: 50%;
                transform: translate(-50%, -50%);
                width: 56px;
                height: 56px;
                border-radius: 50%;
                border: 3px solid transparent;
                border-bottom-color: #2dd4bf;
            }

        @keyframes rotation {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="module" data-plugins="transform-modules-umd">
        // Global Environment Variables
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'ai-calculator-default';
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        // This fully functional local backend replaces the broken Firebase config.
        // It provides real user registration, login validation, and history storage out-of-the-box.
        const initLocalBackend = () => {
        if (!localStorage.getItem('ai_calc_users')) localStorage.setItem('ai_calc_users', JSON.stringify({}));
        if (!localStorage.getItem('ai_calc_db')) localStorage.setItem('ai_calc_db', JSON.stringify({}));
        };
        initLocalBackend();

        const LocalAuth = {
        createUserWithEmailAndPassword: async (auth, email, password) => {
        const users = JSON.parse(localStorage.getItem('ai_calc_users'));
        if (Object.values(users).some(u => u.email === email)) throw new Error("Email already in use.");
        const uid = 'usr_' + Math.random().toString(36).substr(2, 9);
        users[uid] = { uid, email, password };
        localStorage.setItem('ai_calc_users', JSON.stringify(users));
        localStorage.setItem('ai_calc_session', uid);
        window.dispatchEvent(new Event('auth-state-change'));
        return { user: users[uid] };
        },
        signInWithEmailAndPassword: async (auth, email, password) => {
        const users = JSON.parse(localStorage.getItem('ai_calc_users'));
        const user = Object.values(users).find(u => u.email === email && u.password === password);
        if (!user) throw new Error("Invalid email or password.");
        localStorage.setItem('ai_calc_session', user.uid);
        window.dispatchEvent(new Event('auth-state-change'));
        return { user };
        },
        signInAnonymously: async (auth) => {
        const uid = 'anon_' + Math.random().toString(36).substr(2, 9);
        localStorage.setItem('ai_calc_session', uid);
        window.dispatchEvent(new Event('auth-state-change'));
        return { user: { uid, isAnonymous: true } };
        },
        signOut: async (auth) => {
        localStorage.removeItem('ai_calc_session');
        window.dispatchEvent(new Event('auth-state-change'));
        },
        onAuthStateChanged: (auth, callback) => {
        const checkState = () => {
        const uid = localStorage.getItem('ai_calc_session');
        if (uid) {
        const users = JSON.parse(localStorage.getItem('ai_calc_users'));
        callback(users[uid] || { uid, isAnonymous: true });
        } else {
        callback(null);
        }
        };
        window.addEventListener('auth-state-change', checkState);
        checkState();
        return () => window.removeEventListener('auth-state-change', checkState);
        },
        signInWithCustomToken: async () => {}
        };

        const LocalDB = {
        collection: (db, ...paths) => paths.join('/'),
        addDoc: async (path, data) => {
        const db = JSON.parse(localStorage.getItem('ai_calc_db'));
        if (!db[path]) db[path] = {};
        const id = 'doc_' + Math.random().toString(36).substr(2, 9);

        const docData = { ...data };
        if (docData.timestamp === 'SERVER_TIME') {
        docData.timestamp = { toDate: () => new Date() };
        }

        db[path][id] = docData;
        localStorage.setItem('ai_calc_db', JSON.stringify(db));
        window.dispatchEvent(new Event('db-update-' + path));
        return { id };
        },
        serverTimestamp: () => 'SERVER_TIME',
        query: (path, ...args) => ({ path, args }),
        orderBy: (field, direction) => ({ field, direction }),
        onSnapshot: (queryObj, callback) => {
        const path = queryObj.path;
        const trigger = () => {
        const db = JSON.parse(localStorage.getItem('ai_calc_db') || '{}');
        const collectionData = db[path] || {};
        let items = Object.keys(collectionData).map(id => ({
        id,
        data: () => collectionData[id]
        }));

        const sortConfig = queryObj.args.find(a => a.field);
        if (sortConfig) {
        items.sort((a, b) => {
        const valA = a.data()[sortConfig.field]?.toDate ? a.data()[sortConfig.field].toDate().getTime() : 0;
        const valB = b.data()[sortConfig.field]?.toDate ? b.data()[sortConfig.field].toDate().getTime() : 0;
        return sortConfig.direction === 'desc' ? valB - valA : valA - valB;
        });
        }

        callback({ forEach: (fn) => items.forEach(fn) });
        };
        window.addEventListener('db-update-' + path, trigger);
        trigger();
        return () => window.removeEventListener('db-update-' + path, trigger);
        },
        doc: () => {},
        deleteDoc: () => {}
        };

        // Export the working local services back to the React app
        window.FirebaseServices = {
        db: true, // Mark as valid to pass the checks
        auth: true,
        initialAuthToken,
        appId,
        ...LocalAuth,
        ...LocalDB
        };
    </script>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo, useCallback } = React;

        // The API key is securely injected by the platform runtime via a proxy. Leave as empty string.
        const geminiApiKey = "";

        // --- Audio Utils for TTS ---
        const writeString = (view, offset, string) => {
            for (let i = 0; i < string.length; i++) {
                view.setUint8(offset + i, string.charCodeAt(i));
            }
        };

        const base64ToArrayBuffer = (base64) => {
            const binaryString = window.atob(base64);
            const len = binaryString.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            return bytes.buffer;
        };

        const pcmToWav = (pcm16, sampleRate) => {
            const numChannels = 1;
            const byteRate = sampleRate * numChannels * 2;
            const blockAlign = numChannels * 2;
            const dataSize = pcm16.length * 2;
            const buffer = new ArrayBuffer(44 + dataSize);
            const view = new DataView(buffer);

            writeString(view, 0, 'RIFF');
            view.setUint32(4, 36 + dataSize, true);
            writeString(view, 8, 'WAVE');
            writeString(view, 12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true); // PCM
            view.setUint16(22, numChannels, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, byteRate, true);
            view.setUint16(32, blockAlign, true);
            view.setUint16(34, 16, true); // bits per sample
            writeString(view, 36, 'data');
            view.setUint32(40, dataSize, true);

            let offset = 44;
            for (let i = 0; i < pcm16.length; i++, offset += 2) {
                view.setInt16(offset, pcm16[i], true);
            }

            return new Blob([view], { type: 'audio/wav' });
        };

        // --- Icons Component Helper ---
        const Icon = ({ name, size = 24, className = "" }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (iconRef.current && window.lucide && window.lucide.icons[name]) {
                    iconRef.current.innerHTML = '';
                    const iconElement = window.lucide.icons[name].toSvg({ width: size, height: size, class: className });
                    iconRef.current.innerHTML = iconElement;
                }
            }, [name, size, className]);
            return <span ref={iconRef} className="inline-flex items-center justify-center" />;
        };

        // --- Services ---
        const aiSystemPrompt = `You are the brain of an intelligent AI Calculator. Your job is to understand natural language math, financial, and geometric problems in English, Hindi, or Hinglish.

        If the user asks about currency conversion (e.g. USD to INR) or real-time financial data (current gold rate, stock price, etc.), you have access to Google Search. Use the live data to formulate the expression. For example, if 1 USD = 83.5 INR, and user asks for 500 USD in INR, output: "500 * 83.5".

        You must extract the intent, the numbers, and construct a mathematical expression that can be evaluated safely using standard math operators (+, -, *, /, ^, %).
        DO NOT calculate the final answer yourself unless absolutely necessary. Rely on the 'executable_expression' to be evaluated by a deterministic math engine later.

        CRITICAL RULES for 'executable_expression':
        - For percentage like "18% of 5000", output: "5000 * (18 / 100)"
        - STRICT GST RULES:
          - "18% GST on 50000" (User wants ONLY the tax amount) -> "50000 * 0.18"
          - "50000 including 18% GST" (User wants to find base price or tax from a total) -> Base is "50000 / 1.18", Tax is "50000 - (50000 / 1.18)". Extract what is logical.
          - "Add 18% GST to 50000" or "50000 me 18% GST jodkar" (User wants total inclusive of tax) -> "50000 + (50000 * 0.18)"
        - For simple interest "loan 2 lakh, 10%, 5 years", output: "(200000 * 10 * 5) / 100"
        - For area "12 by 15 room", output: "12 * 15"
        - It must be a valid string that math.js can evaluate. Do NOT include currency symbols in the expression.
        - If it requires complex custom logic (like EMI), try to formulate the standard math formula: P * r * (1 + r)^n / ((1 + r)^n - 1) where r is monthly rate. Example: 200000 loan, 10% annual, 5 years (60 months). Monthly rate = 10/(12*100) = 0.008333. Expression: "200000 * (10/1200) * ((1 + (10/1200))^60) / (((1 + (10/1200))^60) - 1)"
        - If you absolutely cannot format it as an expression, format a fallback logic in steps.

        Respond ONLY with a valid JSON object matching this schema:
        {
            "type": "OBJECT",
            "properties": {
                "intent": { "type": "STRING", "description": "Category e.g., 'Percentage', 'EMI', 'Area', 'Basic Math'" },
                "title": { "type": "STRING", "description": "Short title for history e.g., '18% of ₹5000'" },
                "executable_expression": { "type": "STRING", "description": "Strictly math operators and numbers. e.g. '5000 * 0.18'" },
                "formula_display": { "type": "STRING", "description": "Human readable formula e.g. 'Amount × (Rate/100)'" },
                "steps": { "type": "ARRAY", "items": { "type": "STRING" }, "description": "Step by step textual explanation of values." },
                "explanation_hindi": { "type": "STRING", "description": "Explanation in simple Hindi/Hinglish" },
                "explanation_english": { "type": "STRING", "description": "Explanation in English" },
                "unit": { "type": "STRING", "description": "Output unit if any e.g. '₹', 'sq ft', 'years'. Put symbol if currency." },
                "unit_position": { "type": "STRING", "description": "'prefix' or 'suffix'" }
            }
        }`;

        const AIService = {
            async analyzeCalculation(query, context = null) {
                const baseUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent`;
                const apiUrl = `${baseUrl}?key=${geminiApiKey}`;

                let prompt = aiSystemPrompt;
                if (context) {
                    prompt += `\n\nPREVIOUS CALCULATION CONTEXT:\nUser previously asked: "${context.query}"\nPrevious Executable Expression: "${context.expression}"\nPrevious Result: ${context.result}\n\nINSTRUCTION FOR FOLLOW-UP: The user is asking a follow-up question. You MUST use the previous context (like principal, base amounts, tenure, etc.) and only change the variables the user mentions. Replace the updated variables and output a NEW complete 'executable_expression' that recalculates the entire problem with the new variables.`;
                }

                const payload = {
                    contents: [{ parts: [{ text: `User Query: "${query}"` }] }],
                    systemInstruction: { parts: [{ text: prompt }] },
                    generationConfig: { responseMimeType: "application/json" }
                };

                try {
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if(!response.ok) {
                        const errorText = await response.text();
                        console.error("Gemini API Error Response:", errorText);
                        let errMsg = `API Error: ${response.status}`;
                        try {
                            const errData = JSON.parse(errorText);
                            if (errData.error && errData.error.message) {
                                errMsg = errData.error.message;
                            }
                        } catch(e) {}
                        throw new Error(errMsg);
                    }
                    const data = await response.json();
                    const textResponse = data.candidates?.[0]?.content?.parts?.[0]?.text;

                    if (textResponse) {
                        try {
                            // Strip markdown code blocks if the AI accidentally includes them
                            let cleanText = textResponse.trim();
                            if (cleanText.startsWith('```')) {
                                cleanText = cleanText.replace(/^```(?:json)?\n?/, '').replace(/```$/, '').trim();
                            }
                            return JSON.parse(cleanText);
                        } catch (err) {
                            console.error("JSON Parse Error. Raw AI Response:", textResponse);
                            throw new Error("The AI returned a malformed calculation response.");
                        }
                    }
                    throw new Error("Received an empty response from AI.");
                } catch (error) {
                    console.error("AI Analysis Error:", error);
                    throw error;
                }
            },
            async analyzeImage(base64Data, mimeType) {
                const baseUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent`;
                const apiUrl = `${baseUrl}?key=${geminiApiKey}`;

                const prompt = aiSystemPrompt + `\n\nIMAGE TASK: Extract the main mathematical, financial, or logic problem from the image. If it's a receipt/bill, calculate what is logically required (e.g. total with tax). If it's a handwritten problem, solve it.`;

                const payload = {
                    contents: [
                        {
                            parts: [
                                { text: "Solve the calculation problem shown in this image." },
                                { inlineData: { mimeType: mimeType, data: base64Data } }
                            ]
                        }
                    ],
                    systemInstruction: { parts: [{ text: prompt }] },
                    generationConfig: { responseMimeType: "application/json" }
                };

                try {
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if(!response.ok) {
                        const errorText = await response.text();
                        console.error("Gemini Image API Error Response:", errorText);
                        let errMsg = `API Error: ${response.status}`;
                        try {
                            const errData = JSON.parse(errorText);
                            if (errData.error && errData.error.message) {
                                errMsg = errData.error.message;
                            }
                        } catch(e) {}
                        throw new Error(errMsg);
                    }
                    const data = await response.json();
                    const textResponse = data.candidates?.[0]?.content?.parts?.[0]?.text;

                    if (textResponse) {
                        try {
                            let cleanText = textResponse.trim();
                            if (cleanText.startsWith('```')) {
                                cleanText = cleanText.replace(/^```(?:json)?\n?/, '').replace(/```$/, '').trim();
                            }
                            return JSON.parse(cleanText);
                        } catch (err) {
                            console.error("JSON Parse Error. Raw AI Response:", textResponse);
                            throw new Error("The AI returned a malformed image calculation response.");
                        }
                    }
                    throw new Error("Received an empty response from AI.");
                } catch (error) {
                    console.error("AI Image Analysis Error:", error);
                    throw error;
                }
            },
            async speakExplanation(text, language = 'en') {
                const baseUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent`;
                const apiUrl = `${baseUrl}?key=${geminiApiKey}`;

                const payload = {
                    contents: [{
                        parts: [{ text: text }]
                    }],
                    generationConfig: {
                        responseModalities: ["AUDIO"],
                        speechConfig: {
                            voiceConfig: {
                                prebuiltVoiceConfig: { voiceName: language === 'hi' ? "Aoede" : "Puck" }
                            }
                        }
                    }
                };

                try {
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if(!response.ok) {
                        const errorText = await response.text();
                        console.error("Gemini TTS API Error Response:", errorText);
                        throw new Error(`TTS API Request Failed: ${response.status} - ${errorText}`);
                    }
                    const result = await response.json();

                    const part = result?.candidates?.[0]?.content?.parts?.[0];
                    const audioData = part?.inlineData?.data;
                    const mimeType = part?.inlineData?.mimeType;

                    if (audioData && mimeType && mimeType.startsWith("audio/")) {
                        const sampleRateMatch = mimeType.match(/rate=(\d+)/);
                        const sampleRate = sampleRateMatch ? parseInt(sampleRateMatch[1], 10) : 24000;
                        const pcmData = base64ToArrayBuffer(audioData);
                        const pcm16 = new Int16Array(pcmData);
                        const wavBlob = pcmToWav(pcm16, sampleRate);
                        return URL.createObjectURL(wavBlob);
                    }
                    throw new Error("Invalid audio response");
                } catch (error) {
                    console.error("TTS Error:", error);
                    throw error;
                }
            }
        };

        const MathService = {
            evaluate(expression) {
                try {
                    // Use math.js for deterministic, safe evaluation
                    let result = math.evaluate(expression);

                    // Format appropriately (avoid long decimals unless necessary)
                    if (typeof result === 'number') {
                        // Round to 4 decimal places max to avoid floating point weirdness
                        result = Math.round(result * 10000) / 10000;
                    }
                    return result;
                } catch (error) {
                    console.error("Math Evaluation Error:", error, "Expression:", expression);
                    return "Error calculating";
                }
            },
            formatResult(value, unit, position) {
                if (value === "Error calculating" || isNaN(value)) return value;

                // Format numbers with commas (Indian numbering system preference if currency, otherwise standard)
                let formattedStr = value.toString();
                if (typeof value === 'number') {
                     formattedStr = new Intl.NumberFormat('en-IN', { maximumFractionDigits: 2 }).format(value);
                }

                if (!unit) return formattedStr;
                if (position === 'prefix') return `${unit}${formattedStr}`;
                return `${formattedStr} ${unit}`;
            }
        };

        // --- Components ---

        const AuthModal = ({ isOpen, onClose }) => {
            if (!isOpen) return null;
            const [isSignUp, setIsSignUp] = useState(false);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');
            const [loading, setLoading] = useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setError('');
                setLoading(true);
                const { auth, signInWithEmailAndPassword, createUserWithEmailAndPassword } = window.FirebaseServices;
                try {
                    if (!auth) throw new Error("Authentication service is unavailable.");
                    if (isSignUp) {
                        await createUserWithEmailAndPassword(auth, email, password);
                    } else {
                        await signInWithEmailAndPassword(auth, email, password);
                    }
                    onClose();
                } catch (err) {
                    setError(err.message.replace('Firebase: ', ''));
                }
                setLoading(false);
            };

            const handleGuest = async () => {
                const { auth, signInAnonymously } = window.FirebaseServices;
                if(auth) {
                    setLoading(true);
                    try {
                        await signInAnonymously(auth);
                        onClose();
                    } catch(err) {
                        setError(err.message);
                    }
                    setLoading(false);
                }
            };

            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-fade-in-up">
                    <div className="glass-panel w-full max-w-md rounded-3xl p-8 relative border border-brand-500/30 shadow-[0_0_40px_-15px_rgba(45,212,191,0.2)]">
                        <button onClick={onClose} className="absolute top-6 right-6 text-gray-500 hover:text-white transition-colors">
                            <Icon name="x" size={24} />
                        </button>

                        <h2 className="text-2xl font-bold mb-2 text-white">
                            {isSignUp ? 'Create an Account' : 'Welcome Back'}
                        </h2>
                        <p className="text-gray-400 text-sm mb-6">
                            {isSignUp ? 'Sign up to save your calculation history.' : 'Sign in to access your calculations.'}
                        </p>

                        {error && (
                            <div className="mb-4 p-3 rounded-xl bg-red-500/10 border border-red-500/30 text-red-400 text-sm">
                                {error}
                            </div>
                        )}

                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="block text-xs font-medium text-gray-400 mb-1 ml-1 uppercase tracking-wider">Email</label>
                                <input
                                    type="email"
                                    value={email}
                                    onChange={(e) => setEmail(e.target.value)}
                                    required
                                    className="w-full bg-dark-surface border border-dark-border rounded-xl px-4 py-3 text-white focus:outline-none focus:border-brand-500/50"
                                    placeholder="you@example.com"
                                />
                            </div>
                            <div>
                                <label className="block text-xs font-medium text-gray-400 mb-1 ml-1 uppercase tracking-wider">Password</label>
                                <input
                                    type="password"
                                    value={password}
                                    onChange={(e) => setPassword(e.target.value)}
                                    required
                                    className="w-full bg-dark-surface border border-dark-border rounded-xl px-4 py-3 text-white focus:outline-none focus:border-brand-500/50"
                                    placeholder="••••••••"
                                />
                            </div>

                            <button
                                type="submit"
                                disabled={loading}
                                className="w-full py-3 mt-2 rounded-xl bg-gradient-to-r from-brand-600 to-brand-500 hover:from-brand-500 hover:to-brand-400 text-white font-medium transition-all disabled:opacity-50"
                            >
                                {loading ? 'Processing...' : (isSignUp ? 'Sign Up' : 'Sign In')}
                            </button>
                        </form>

                        <div className="mt-6 pt-6 border-t border-dark-border">
                            <button
                                onClick={handleGuest}
                                disabled={loading}
                                className="w-full py-3 rounded-xl bg-dark-surface hover:bg-dark-border border border-dark-border transition-colors text-sm font-medium text-white mb-4"
                            >
                                Continue as Guest
                            </button>

                            <p className="text-center text-sm text-gray-400">
                                {isSignUp ? 'Already have an account? ' : "Don't have an account? "}
                                <button onClick={() => setIsSignUp(!isSignUp)} className="text-brand-400 hover:text-brand-300 font-medium">
                                    {isSignUp ? 'Sign In' : 'Sign Up'}
                                </button>
                            </p>
                        </div>
                    </div>
                </div>
            );
        };

        const Header = ({ user, onLogin, onLogout, setView, view }) => {
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
            const menuRef = useRef(null);

            // Close mobile menu when clicking outside
            useEffect(() => {
                const handleClickOutside = (event) => {
                    if (menuRef.current && !menuRef.current.contains(event.target)) {
                        setIsMobileMenuOpen(false);
                    }
                };
                if (isMobileMenuOpen) {
                    document.addEventListener('mousedown', handleClickOutside);
                }
                return () => document.removeEventListener('mousedown', handleClickOutside);
            }, [isMobileMenuOpen]);

            return (
                <header className="fixed top-0 w-full z-50 glass-panel border-b border-dark-border" ref={menuRef}>
                    <div className="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
                        <div className="flex items-center gap-2 cursor-pointer" onClick={() => { setView('home'); setIsMobileMenuOpen(false); }}>
                            <div className="w-8 h-8 rounded-lg bg-gradient-to-br from-brand-400 to-brand-600 flex items-center justify-center">
                                <Icon name="sparkles" size={18} className="text-white" />
                            </div>
                            <span className="font-bold text-lg sm:text-xl tracking-tight">
                                AI Calculator
                            </span>
                        </div>

                        {/* Desktop Navigation - Center Aligned */}
                        <nav className="hidden md:flex flex-1 justify-center items-center gap-8 text-sm font-medium text-gray-400">
                            <button onClick={() => setView('home')} className={`hover:text-white transition-colors flex items-center gap-2 ${view === 'home' ? 'text-brand-400 font-semibold' : ''}`}>
                                <Icon name="home" size={16} /> Home
                            </button>
                            {user && (
                                <>
                                    <button onClick={() => setView('library')} className={`hover:text-white transition-colors flex items-center gap-2 ${view === 'library' ? 'text-brand-400 font-semibold' : ''}`}>
                                        <Icon name="grid" size={16} /> Library
                                    </button>
                                    <button onClick={() => setView('history')} className={`hover:text-white transition-colors flex items-center gap-2 ${view === 'history' ? 'text-brand-400 font-semibold' : ''}`}>
                                        <Icon name="history" size={16} /> History
                                    </button>
                                </>
                            )}
                        </nav>

                        <div className="flex items-center gap-3">
                            {user ? (
                                <div className="flex items-center gap-2 sm:gap-3">
                                    <div className="hidden sm:flex items-center text-xs text-gray-400 bg-dark-surface/50 px-3 py-1.5 rounded-full border border-dark-border">
                                        <Icon name="user" size={14} className="mr-1.5" />
                                        {user.uid.substring(0,6)}
                                    </div>

                                    {/* Desktop Logout - Hidden on Mobile */}
                                    <button onClick={() => { onLogout(); setView('home'); }} className="hidden md:flex items-center gap-2 text-sm px-4 py-2 rounded-full border border-dark-border hover:bg-red-500/10 hover:text-red-400 hover:border-red-500/30 transition-all">
                                        <Icon name="log-out" size={16} />
                                        Logout
                                    </button>

                                    {}
                                    <button
                                        className="md:hidden flex items-center justify-center w-10 h-10 text-gray-300 hover:text-white transition-all rounded-xl bg-dark-surface border border-dark-border shadow-sm active:scale-95"
                                        onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)}
                                        aria-label={isMobileMenuOpen ? "Close menu" : "Open menu"}
                                    >
                                        <div className="w-5 h-3.5 flex flex-col justify-between items-center relative">
                                            <span className={`block w-full h-[2px] bg-current rounded-full transition-all duration-300 ease-out origin-center ${isMobileMenuOpen ? 'translate-y-[6px] rotate-45' : ''}`}></span>
                                            <span className={`block w-full h-[2px] bg-current rounded-full transition-all duration-300 ease-out ${isMobileMenuOpen ? 'opacity-0 scale-75' : 'opacity-100'}`}></span>
                                            <span className={`block w-full h-[2px] bg-current rounded-full transition-all duration-300 ease-out origin-center ${isMobileMenuOpen ? '-translate-y-[6px] -rotate-45' : ''}`}></span>
                                        </div>
                                    </button>
                                </div>
                            ) : (
                                <button onClick={onLogin} className="text-sm px-5 py-2 rounded-full bg-white text-black hover:bg-gray-200 transition-colors font-medium flex items-center gap-2 shadow-lg shadow-white/5">
                                    <Icon name="user" size={16} /> <span>Sign In</span>
                                </button>
                            )}
                        </div>
                    </div>

                    {/* Premium Mobile Menu Dropdown */}
                    {isMobileMenuOpen && user && (
                        <div className="md:hidden absolute top-16 left-0 right-0 w-full glass-panel border-b border-dark-border shadow-2xl bg-[#0a0a0a]/98 backdrop-blur-2xl animate-fade-in-up z-50">
                            <nav className="flex flex-col p-4 space-y-2">
                                <button onClick={() => { setView('home'); setIsMobileMenuOpen(false); }} className={`w-full text-left text-base py-3.5 flex items-center gap-4 rounded-xl px-4 transition-all ${view === 'home' ? 'bg-brand-500/10 text-brand-400 font-semibold border border-brand-500/20' : 'text-gray-300 hover:text-white hover:bg-dark-surface border border-transparent'}`}>
                                    <Icon name="home" size={20} className={view === 'home' ? 'text-brand-400' : 'text-gray-500'} /> Home
                                </button>
                                <button onClick={() => { setView('library'); setIsMobileMenuOpen(false); }} className={`w-full text-left text-base py-3.5 flex items-center gap-4 rounded-xl px-4 transition-all ${view === 'library' ? 'bg-brand-500/10 text-brand-400 font-semibold border border-brand-500/20' : 'text-gray-300 hover:text-white hover:bg-dark-surface border border-transparent'}`}>
                                    <Icon name="grid" size={20} className={view === 'library' ? 'text-brand-400' : 'text-gray-500'} /> Library
                                </button>
                                <button onClick={() => { setView('history'); setIsMobileMenuOpen(false); }} className={`w-full text-left text-base py-3.5 flex items-center gap-4 rounded-xl px-4 transition-all ${view === 'history' ? 'bg-brand-500/10 text-brand-400 font-semibold border border-brand-500/20' : 'text-gray-300 hover:text-white hover:bg-dark-surface border border-transparent'}`}>
                                    <Icon name="history" size={20} className={view === 'history' ? 'text-brand-400' : 'text-gray-500'} /> History
                                </button>
                                <div className="h-px bg-dark-border my-2 mx-2"></div>
                                <button onClick={() => { onLogout(); setIsMobileMenuOpen(false); setView('home'); }} className="w-full text-left text-base py-3.5 flex items-center gap-4 rounded-xl px-4 text-red-400 hover:text-red-300 hover:bg-red-500/10 transition-all border border-transparent">
                                    <Icon name="log-out" size={20} /> Logout
                                </button>
                            </nav>
                        </div>
                    )}
                </header>
            );
        };

        const SmartInputArea = ({ onCalculate, isProcessing }) => {
            const [query, setQuery] = useState('');
            const textareaRef = useRef(null);
            const fileInputRef = useRef(null);

            const handleSubmit = () => {
                if (query.trim() && !isProcessing) {
                    onCalculate(query);
                }
            };

            const handleKeyDown = (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    handleSubmit();
                }
            };

            const insertExample = (text) => {
                setQuery(text);
                if (textareaRef.current) textareaRef.current.focus();
            };

            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    const base64 = event.target.result.split(',')[1];
                    onCalculate(null, { base64, mimeType: file.type });
                };
                reader.readAsDataURL(file);
                e.target.value = ''; // Reset input
            };

            return (
                <div className="w-full max-w-3xl mx-auto animate-fade-in-up">
                    <div className="text-center mb-6 md:mb-8">
                        <h1 className="text-3xl sm:text-4xl md:text-6xl font-bold mb-3 md:mb-4 tracking-tight">
                            Every Calculation.<br/>
                            <span className="ai-gradient-text">One Intelligent Calculator.</span>
                        </h1>
                        <p className="text-gray-400 text-sm sm:text-base md:text-xl px-4">
                            "हर सवाल का हिसाब, AI के साथ।"
                        </p>
                    </div>

                    <div className="relative group">
                        <div className="absolute -inset-1 bg-gradient-to-r from-brand-500 to-purple-600 rounded-[2rem] blur opacity-25 group-hover:opacity-40 transition duration-1000 group-hover:duration-200"></div>
                        <div className="relative glass-panel rounded-[2rem] p-2 flex flex-col transition-all border border-dark-border focus-within:border-brand-500/50">
                            <textarea
                                ref={textareaRef}
                                value={query}
                                onChange={(e) => setQuery(e.target.value)}
                                onKeyDown={handleKeyDown}
                                placeholder="Type your math problem, EMI query, percentage, or formula..."
                                className="w-full bg-transparent text-white placeholder-gray-500 px-4 sm:px-6 py-4 sm:py-5 outline-none resize-none text-base sm:text-lg md:text-xl min-h-[100px] sm:min-h-[120px]"
                                disabled={isProcessing}
                            />

                            <div className="flex flex-wrap items-center justify-between px-2 sm:px-4 pb-2 sm:pb-3 gap-3">
                                <div className="flex gap-1 sm:gap-2 text-gray-400">
                                    <button className="p-2 rounded-full hover:bg-white/5 hover:text-white transition-colors cursor-not-allowed opacity-50" title="Voice coming soon">
                                        <Icon name="mic" size={20} />
                                    </button>
                                    <input type="file" ref={fileInputRef} onChange={handleImageUpload} accept="image/*" className="hidden" />
                                    <button onClick={() => fileInputRef.current?.click()} className="p-2 rounded-full hover:bg-white/5 hover:text-brand-400 transition-colors" title="Scan Problem with Image" disabled={isProcessing}>
                                        <Icon name="camera" size={20} />
                                    </button>
                                </div>
                                <button
                                    onClick={handleSubmit}
                                    disabled={!query.trim() || isProcessing}
                                    className={`px-5 sm:px-6 py-2.5 rounded-full font-medium transition-all flex items-center justify-center gap-2 w-full sm:w-auto
                                        ${query.trim() && !isProcessing ? 'bg-white text-black hover:scale-105' : 'bg-white/10 text-white/50 cursor-not-allowed'}`}
                                >
                                    {isProcessing ? 'Thinking...' : 'Calculate'}
                                    {!isProcessing && <Icon name="arrow-right" size={18} />}
                                </button>
                            </div>
                        </div>
                    </div>

                    <div className="mt-8 flex flex-wrap gap-2 justify-center text-xs sm:text-sm px-2">
                        <span className="text-gray-500 px-2 sm:px-3 py-1">Examples:</span>
                        {[
                            "18% GST on ₹50,000",
                            "5000 ka 20 percent",
                            "2 lakh loan 10% 5 years EMI"
                        ].map((ex, i) => (
                            <button key={i} onClick={() => insertExample(ex)} className="px-3 sm:px-4 py-1.5 rounded-full border border-dark-border hover:border-brand-500/50 hover:text-brand-400 text-gray-300 transition-colors whitespace-nowrap">
                                {ex}
                            </button>
                        ))}
                    </div>
                </div>
            );
        };

        const ResultCard = ({ resultData, onClear, onFollowUp, isProcessing }) => {
            if (!resultData) return null;

            const { query, analysis, finalResult, formattedResult } = resultData;
            const [followUpQuery, setFollowUpQuery] = useState('');
            const [audioPlaying, setAudioPlaying] = useState({ en: false, hi: false });
            const [loadingAudio, setLoadingAudio] = useState({ en: false, hi: false });
            const [isCopied, setIsCopied] = useState(false);
            const [shareState, setShareState] = useState({ status: 'idle', text: 'Share' });
            const audioRef = useRef(null);
            const textareaRef = useRef(null);

            const handleFollowUp = () => {
                if (followUpQuery.trim() && !isProcessing) {
                    onFollowUp(followUpQuery);
                    setFollowUpQuery('');
                    if (textareaRef.current) {
                        textareaRef.current.style.height = 'auto';
                    }
                }
            };

            const handleCopy = async () => {
                const textToCopy = `AI Calculator\nQuery: ${query}\nResult: ${formattedResult}\nFormula: ${analysis.formula_display}\nExplanation: ${analysis.explanation_english}`;
                try {
                    const textArea = document.createElement("textarea");
                    textArea.value = textToCopy;
                    textArea.style.top = "0";
                    textArea.style.left = "0";
                    textArea.style.position = "fixed";
                    textArea.style.opacity = "0";
                    document.body.appendChild(textArea);
                    textArea.focus();
                    textArea.select();
                    try {
                        document.execCommand('copy');
                        setIsCopied(true);
                        setTimeout(() => setIsCopied(false), 2000);
                    } catch (err) {
                        console.error('Fallback: Oops, unable to copy', err);
                    } finally {
                        document.body.removeChild(textArea);
                    }
                } catch (err) {
                    console.error("Failed to copy", err);
                }
            };

            const handleShare = async () => {
                const shareData = {
                    title: 'AI Calculator Result',
                    text: `AI Calculator\nQuery: ${query}\nResult: ${formattedResult}\nFormula: ${analysis.formula_display}`
                };

                if (window.location.href.startsWith('http')) {
                    shareData.url = window.location.href;
                }

                try {
                    if (navigator.share) {
                        await navigator.share(shareData);
                        setShareState({ status: 'success', text: 'Shared!' });
                    } else {
                        await handleCopy();
                        setShareState({ status: 'success', text: 'Copied!' });
                    }
                } catch (err) {
                    await handleCopy();
                    setShareState({ status: 'success', text: 'Copied!' });
                } finally {
                    setTimeout(() => setShareState({ status: 'idle', text: 'Share' }), 2000);
                }
            };

            const playExplanation = async (text, lang) => {
                if (audioPlaying[lang]) {
                    if (audioRef.current) {
                        audioRef.current.pause();
                        audioRef.current = null;
                    }
                    setAudioPlaying({ en: false, hi: false });
                    return;
                }

                try {
                    setLoadingAudio({ ...loadingAudio, [lang]: true });
                    if (audioRef.current) audioRef.current.pause();

                    const audioUrl = await AIService.speakExplanation(text, lang);
                    const audio = new Audio(audioUrl);
                    audioRef.current = audio;

                    audio.onended = () => {
                        setAudioPlaying({ en: false, hi: false });
                    };

                    await audio.play();
                    setAudioPlaying({ en: false, hi: false, [lang]: true });
                } catch (err) {
                    console.error("Failed to play audio", err);
                } finally {
                    setLoadingAudio({ ...loadingAudio, [lang]: false });
                }
            };

            return (
                <div className="w-full max-w-3xl mx-auto mt-6 md:mt-8 animate-fade-in-up">
                    <div className="glass-panel rounded-3xl p-5 md:p-8 relative overflow-hidden border border-brand-500/30 shadow-[0_0_40px_-15px_rgba(45,212,191,0.2)]">

                        {/* decorative element */}
                        <div className="absolute top-0 right-0 w-48 sm:w-64 h-48 sm:h-64 bg-brand-500/5 rounded-full blur-3xl -translate-y-1/2 translate-x-1/2"></div>

                        <div className="flex justify-between items-start mb-4 md:mb-6">
                            <div className="pr-4">
                                <span className="inline-block px-3 py-1 rounded-full bg-brand-500/10 text-brand-400 text-xs font-semibold mb-2 sm:mb-3 tracking-wider uppercase">
                                    {analysis.intent}
                                </span>
                                <h3 className="text-gray-400 text-sm sm:text-lg mb-1 font-medium">Your Query:</h3>
                                <p className="text-white text-base sm:text-xl">"{query}"</p>
                            </div>
                            <button onClick={onClear} className="text-gray-500 hover:text-white p-1 sm:p-2 flex-shrink-0">
                                <Icon name="x" size={24} />
                            </button>
                        </div>

                        <div className="my-6 md:my-8 flex items-baseline gap-2 pb-6 border-b border-dark-border w-full">
                            <span className="text-4xl sm:text-5xl md:text-7xl font-bold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-white to-gray-400 break-words w-full overflow-wrap-anywhere">
                                {formattedResult}
                            </span>
                        </div>

                        <div className="grid md:grid-cols-2 gap-6 md:gap-8">
                            <div className="space-y-4">
                                <div>
                                    <h4 className="text-brand-400 font-medium mb-2 flex items-center gap-2 text-sm sm:text-base">
                                        <Icon name="function-square" size={16} /> Formula Used
                                    </h4>
                                    <div className="bg-dark-surface p-3 rounded-xl border border-dark-border font-mono text-xs sm:text-sm text-gray-300 overflow-x-auto">
                                        {analysis.formula_display || analysis.executable_expression}
                                    </div>
                                </div>

                                {analysis.steps && analysis.steps.length > 0 && (
                                    <div>
                                        <h4 className="text-gray-400 font-medium mb-2 text-sm sm:text-base">Steps</h4>
                                        <ul className="space-y-2">
                                            {analysis.steps.map((step, i) => (
                                                <li key={i} className="flex gap-2 sm:gap-3 text-gray-300 text-xs sm:text-sm">
                                                    <span className="text-brand-600 font-bold flex-shrink-0">{i+1}.</span>
                                                    <span>{step}</span>
                                                </li>
                                            ))}
                                        </ul>
                                    </div>
                                )}
                            </div>

                            <div className="space-y-4 bg-dark-surface/50 p-4 sm:p-5 rounded-2xl border border-dark-border/50">
                                <div>
                                    <div className="flex justify-between items-center mb-2">
                                        <h4 className="text-gray-400 font-medium text-xs sm:text-sm uppercase tracking-wider">Explanation (English)</h4>
                                        <button
                                            onClick={() => playExplanation(analysis.explanation_english, 'en')}
                                            disabled={loadingAudio.en}
                                            className="text-gray-400 hover:text-brand-400 transition-colors p-1"
                                            title="Listen to explanation"
                                        >
                                            {loadingAudio.en ? <div className="w-4 h-4 border-2 border-brand-500 border-t-transparent rounded-full animate-spin"></div> :
                                             audioPlaying.en ? <Icon name="volume-x" size={16} /> : <Icon name="volume-2" size={16} />}
                                        </button>
                                    </div>
                                    <p className="text-gray-200 text-xs sm:text-sm leading-relaxed">
                                        {analysis.explanation_english}
                                    </p>
                                </div>
                                <div className="border-t border-dark-border/50 pt-4 mt-2">
                                    <div className="flex justify-between items-center mb-2">
                                        <h4 className="text-gray-400 font-medium text-xs sm:text-sm uppercase tracking-wider">विवरण (Hindi)</h4>
                                        <button
                                            onClick={() => playExplanation(analysis.explanation_hindi, 'hi')}
                                            disabled={loadingAudio.hi}
                                            className="text-gray-400 hover:text-brand-400 transition-colors p-1"
                                            title="विवरण सुनें"
                                        >
                                            {loadingAudio.hi ? <div className="w-4 h-4 border-2 border-brand-500 border-t-transparent rounded-full animate-spin"></div> :
                                             audioPlaying.hi ? <Icon name="volume-x" size={16} /> : <Icon name="volume-2" size={16} />}
                                        </button>
                                    </div>
                                    <p className="text-gray-200 text-xs sm:text-sm leading-relaxed">
                                        {analysis.explanation_hindi}
                                    </p>
                                </div>
                            </div>
                        </div>

                        <div className="mt-6 sm:mt-8 flex flex-col sm:flex-row gap-3 pt-6 border-t border-dark-border">
                            <button onClick={handleCopy} aria-label="Copy Result" className="flex-1 py-3 rounded-xl bg-dark-surface hover:bg-dark-border border border-dark-border transition-colors text-sm font-medium flex justify-center items-center gap-2">
                                <Icon name={isCopied ? "check" : "copy"} size={16} /> {isCopied ? "Copied!" : "Copy Result"}
                            </button>
                            <button onClick={handleShare} aria-label="Share Result" className="flex-1 py-3 rounded-xl bg-dark-surface hover:bg-dark-border border border-dark-border transition-colors text-sm font-medium flex justify-center items-center gap-2">
                                <Icon name={shareState.status === 'success' ? "check" : "share-2"} size={16} /> {shareState.text}
                            </button>
                        </div>

                        {/* Follow-up Chat Section */}
                        <div className="mt-6 pt-6 border-t border-dark-border">
                            <div className="flex flex-col sm:flex-row gap-3 items-stretch sm:items-end">
                                <textarea
                                    ref={textareaRef}
                                    rows="1"
                                    value={followUpQuery}
                                    onChange={(e) => {
                                        setFollowUpQuery(e.target.value);
                                        e.target.style.height = 'auto';
                                        e.target.style.height = (e.target.scrollHeight) + 'px';
                                    }}
                                    onKeyDown={(e) => {
                                        if (e.key === 'Enter' && !e.shiftKey) {
                                            e.preventDefault();
                                            handleFollowUp();
                                        }
                                    }}
                                    placeholder="Ask a follow-up... (e.g., 'What if the interest is 12%?')"
                                    className="flex-1 bg-dark-surface border border-dark-border rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brand-500/50 resize-none overflow-hidden max-h-32 min-h-[46px]"
                                    disabled={isProcessing}
                                />
                                <button
                                    onClick={handleFollowUp}
                                    disabled={!followUpQuery.trim() || isProcessing}
                                    aria-label="Send message"
                                    className="h-[46px] px-6 rounded-xl bg-brand-600 hover:bg-brand-500 text-white font-medium transition-colors disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center sm:min-w-[80px]"
                                >
                                    {isProcessing ? <div className="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></div> : <Icon name="send" size={18} />}
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const CategoryLibrary = () => {
            const categories = [
                { icon: 'percent', name: 'Percentage', desc: 'Find %, GST, discounts' },
                { icon: 'landmark', name: 'Finance', desc: 'EMI, SIP, Compound Interest' },
                { icon: 'ruler', name: 'Geometry', desc: 'Area, Volume, Perimeter' },
                { icon: 'briefcase', name: 'Business', desc: 'Profit, Loss, Margins' },
                { icon: 'scale', name: 'Unit Converter', desc: 'Length, Weight, Temp' },
                { icon: 'calendar', name: 'Time & Date', desc: 'Age, Duration, Days' },
            ];

            return (
                <div className="max-w-6xl mx-auto py-12 animate-fade-in-up">
                    <div className="text-center mb-12">
                        <h2 className="text-3xl font-bold mb-4">Calculator Library</h2>
                        <p className="text-gray-400">Can't find the words? Browse our deterministic calculators.</p>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        {categories.map((cat, i) => (
                            <div key={i} className="glass-panel p-6 rounded-2xl hover:border-brand-500/50 transition-colors cursor-pointer group">
                                <div className="w-12 h-12 rounded-xl bg-dark-surface flex items-center justify-center mb-4 group-hover:bg-brand-500/20 group-hover:text-brand-400 transition-colors">
                                    <Icon name={cat.icon} size={24} />
                                </div>
                                <h3 className="text-lg font-semibold mb-2">{cat.name}</h3>
                                <p className="text-sm text-gray-400">{cat.desc}</p>
                            </div>
                        ))}
                    </div>
                    <div className="mt-12 text-center text-gray-500 text-sm">
                        Pro tip: You don't need to select a category. Just ask your question on the home page!
                    </div>
                </div>
            );
        };

        const HistoryPanel = ({ user }) => {
            const [history, setHistory] = useState([]);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                if (!user || !window.FirebaseServices.db) return;

                const { db, collection, query, orderBy, onSnapshot, appId } = window.FirebaseServices;
                const historyRef = collection(db, 'artifacts', appId, 'users', user.uid, 'history');
                const q = query(historyRef, orderBy('timestamp', 'desc'));

                const unsubscribe = onSnapshot(q, (snapshot) => {
                    const items = [];
                    snapshot.forEach((doc) => {
                        items.push({ id: doc.id, ...doc.data() });
                    });
                    setHistory(items);
                    setLoading(false);
                }, (error) => {
                    console.error("History fetch error:", error);
                    setLoading(false);
                });

                return () => unsubscribe();
            }, [user]);

            if (loading) return <div className="text-center py-20 text-gray-400">Loading history...</div>;

            return (
                <div className="max-w-4xl mx-auto py-12 animate-fade-in-up">
                    <h2 className="text-3xl font-bold mb-8 flex items-center gap-3">
                        <Icon name="history" size={28} className="text-brand-400" /> Your Calculations
                    </h2>

                    {history.length === 0 ? (
                        <div className="text-center py-20 bg-dark-surface rounded-2xl border border-dark-border">
                            <Icon name="inbox" size={48} className="mx-auto mb-4 text-gray-600" />
                            <p className="text-gray-400">No calculations saved yet.</p>
                        </div>
                    ) : (
                        <div className="space-y-4">
                            {history.map(item => (
                                <div key={item.id} className="glass-panel p-5 rounded-2xl flex flex-col sm:flex-row gap-4 items-start sm:items-center justify-between group">
                                    <div>
                                        <div className="text-xs text-brand-400 font-semibold mb-1 uppercase tracking-wider">{item.category}</div>
                                        <h3 className="text-lg text-white font-medium mb-1">{item.query}</h3>
                                        <p className="text-sm text-gray-400">Result: <span className="text-gray-200">{item.result}</span></p>
                                    </div>
                                    <div className="text-sm text-gray-500 whitespace-nowrap">
                                        {item.timestamp ? new Date(item.timestamp.toDate()).toLocaleDateString() : 'Just now'}
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [view, setView] = useState('home'); // home, library, history
            const [isProcessing, setIsProcessing] = useState(false);
            const [currentResult, setCurrentResult] = useState(null);
            const [authLoading, setAuthLoading] = useState(true);
            const [errorMsg, setErrorMsg] = useState(null);
            const [showAuthModal, setShowAuthModal] = useState(false);

            useEffect(() => {
                const { auth, signInAnonymously, signInWithCustomToken, initialAuthToken, onAuthStateChanged } = window.FirebaseServices;
                if (!auth) {
                    setAuthLoading(false);
                    return;
                }

                const initAuth = async () => {
                    try {
                        if (initialAuthToken) {
                            await signInWithCustomToken(auth, initialAuthToken);
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch (error) {
                        console.error("Auth error:", error);
                    }
                };

                initAuth();

                const unsubscribe = onAuthStateChanged(auth, (u) => {
                    setUser(u);
                    setAuthLoading(false);
                });

                return () => unsubscribe();
            }, []);

            const handleLogin = () => {
                 setShowAuthModal(true);
            };

            const handleLogout = async () => {
                const { auth, signOut } = window.FirebaseServices;
                if(auth) await signOut(auth);
            };

            const saveToHistory = async (query, analysis, formattedResult) => {
                if (!user || !window.FirebaseServices.db) return;
                const { db, collection, addDoc, serverTimestamp, appId } = window.FirebaseServices;

                try {
                    const historyRef = collection(db, 'artifacts', appId, 'users', user.uid, 'history');
                    await addDoc(historyRef, {
                        query: query,
                        category: analysis.intent,
                        result: formattedResult,
                        expression: analysis.executable_expression,
                        timestamp: serverTimestamp()
                    });
                } catch (error) {
                    console.error("Failed to save history:", error);
                }
            };

            const processCalculation = async (queryText, imagePayload = null, context = null) => {
                setIsProcessing(true);
                setErrorMsg(null);

                if (!context) {
                    setCurrentResult(null);
                }

                try {
                    let analysis;
                    let displayQuery = queryText;

                    if (imagePayload) {
                        analysis = await AIService.analyzeImage(imagePayload.base64, imagePayload.mimeType);
                        displayQuery = analysis.title || "Image Calculation";
                    } else {
                        analysis = await AIService.analyzeCalculation(queryText, context);
                    }

                    console.log("AI Analysis:", analysis);

                    // 2. Perform deterministic calculation locally based on AI's expression extraction
                    const rawResult = MathService.evaluate(analysis.executable_expression);

                    // 3. Format result
                    const formattedResult = MathService.formatResult(rawResult, analysis.unit, analysis.unit_position);

                    const resultData = {
                        query: displayQuery,
                        analysis,
                        finalResult: rawResult,
                        formattedResult
                    };

                    setCurrentResult(resultData);

                    // 4. Save to history
                    if(rawResult !== "Error calculating") {
                        saveToHistory(displayQuery, analysis, formattedResult);
                    }

                } catch (error) {
                    console.error("Processing failed:", error);
                    // Pass the exact error message to the UI instead of a generic one
                    setErrorMsg(error.message || "I couldn't understand that calculation. Try phrasing it as a math problem.");
                } finally {
                    setIsProcessing(false);
                }
            };

            if (authLoading) {
                return <div className="min-h-screen flex items-center justify-center bg-dark-bg"><span className="loader"></span></div>;
            }

            return (
                <div className="min-h-screen bg-dark-bg text-gray-100 flex flex-col relative selection:bg-brand-500/30">
                    {/* Background decoration */}
                    <div className="fixed inset-0 pointer-events-none overflow-hidden z-0">
                        <div className="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-brand-900/20 blur-[120px]"></div>
                        <div className="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] rounded-full bg-purple-900/10 blur-[120px]"></div>
                    </div>

                    <Header user={user} onLogin={handleLogin} onLogout={handleLogout} setView={setView} view={view} />

                    <AuthModal isOpen={showAuthModal} onClose={() => setShowAuthModal(false)} />

                    <main className="flex-1 pt-20 sm:pt-24 px-4 pb-12 z-10">
                        {}
                        {view === 'home' && (
                            <div className="w-full">
                                {!currentResult ? (
                                    <SmartInputArea onCalculate={(q, img) => processCalculation(q, img)} isProcessing={isProcessing} />
                                ) : (
                                    <ResultCard
                                        resultData={currentResult}
                                        onClear={() => setCurrentResult(null)}
                                        onFollowUp={(followUpQuery) => processCalculation(followUpQuery, null, {
                                            query: currentResult.query,
                                            result: currentResult.formattedResult,
                                            expression: currentResult.analysis.executable_expression
                                        })}
                                        isProcessing={isProcessing}
                                    />
                                )}

                                {errorMsg && (
                                    <div className="mt-8 p-5 bg-red-500/10 border border-red-500/30 rounded-2xl text-red-400 text-center max-w-lg mx-auto animate-fade-in-up">
                                        <Icon name="alert-circle" size={24} className="mx-auto mb-2 opacity-80" />
                                        <p>{errorMsg}</p>
                                    </div>
                                )}

                                {isProcessing && (
                                    <div className="mt-12 flex flex-col items-center text-brand-400 animate-pulse">
                                        <div className="loader mb-4"></div>
                                        <span>AI is decoding your calculation...</span>
                                    </div>
                                )}
                            </div>
                        )}

                        {view === 'library' && <CategoryLibrary />}

                        {view === 'history' && <HistoryPanel user={user} />}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
