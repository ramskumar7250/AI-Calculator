<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>AI Calculator</title>
    <meta name="description"
          content="AI Calculator - Solve calculations using AI or normal mathematical expressions." />

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #f5f7ff, #eef1ff);
            color: #171717;
            min-height: 100vh;
        }

        .container {
            width: min(100% - 30px, 900px);
            margin: 0 auto;
            padding: 35px 0 50px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 65px;
            height: 65px;
            border-radius: 18px;
            background: linear-gradient(135deg, #6c4cff, #8b5cf6);
            color: white;
            font-size: 30px;
            font-weight: bold;
            box-shadow: 0 10px 30px rgba(108, 76, 255, 0.25);
            margin-bottom: 15px;
        }

        h1 {
            font-size: 36px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #666;
            font-size: 16px;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.08);
            border: 1px solid #e9e9ef;
        }

        label {
            display: block;
            font-weight: 700;
            margin-bottom: 10px;
            font-size: 15px;
        }

        textarea {
            width: 100%;
            min-height: 150px;
            resize: vertical;
            border: 2px solid #e5e5ec;
            border-radius: 16px;
            padding: 16px;
            font-size: 17px;
            outline: none;
            transition: 0.2s;
            font-family: inherit;
        }

            textarea:focus {
                border-color: #6c4cff;
                box-shadow: 0 0 0 4px rgba(108, 76, 255, 0.1);
            }

        .examples {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 14px 0 20px;
        }

        .example {
            border: 1px solid #ddd;
            background: #fafafa;
            padding: 8px 12px;
            border-radius: 999px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
        }

            .example:hover {
                background: #eeeaff;
                border-color: #6c4cff;
            }

        .calculate-btn {
            width: 100%;
            border: none;
            border-radius: 15px;
            padding: 16px;
            background: linear-gradient(135deg, #6c4cff, #8b5cf6);
            color: white;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

            .calculate-btn:hover {
                transform: translateY(-1px);
                box-shadow: 0 10px 25px rgba(108, 76, 255, 0.25);
            }

            .calculate-btn:disabled {
                opacity: 0.6;
                cursor: not-allowed;
                transform: none;
            }

        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
            color: #6c4cff;
            font-weight: 600;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #ddd;
            border-top-color: #6c4cff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .error {
            display: none;
            margin-top: 20px;
            background: #fff0f0;
            color: #c62828;
            border: 1px solid #ffcaca;
            padding: 14px;
            border-radius: 12px;
        }

        .result {
            display: none;
            margin-top: 25px;
        }

        .result-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .answer-box {
            background: #f5f3ff;
            border: 1px solid #ddd5ff;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 15px;
        }

        .answer-label {
            color: #6c4cff;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .answer {
            font-size: 25px;
            font-weight: 800;
            word-break: break-word;
        }

        .steps-box {
            background: #fafafa;
            border: 1px solid #e5e5e5;
            border-radius: 16px;
            padding: 20px;
        }

            .steps-box h3 {
                margin-bottom: 12px;
                font-size: 17px;
            }

        .steps {
            white-space: pre-wrap;
            line-height: 1.7;
            color: #444;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .action-btn {
            border: 1px solid #ddd;
            background: white;
            padding: 11px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
        }

            .action-btn:hover {
                background: #f5f3ff;
                border-color: #6c4cff;
            }

        .followup {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

            .followup input {
                flex: 1;
                border: 1px solid #ddd;
                border-radius: 10px;
                padding: 12px;
                font-size: 15px;
                outline: none;
            }

                .followup input:focus {
                    border-color: #6c4cff;
                }

            .followup button {
                border: none;
                background: #171717;
                color: white;
                border-radius: 10px;
                padding: 12px 18px;
                cursor: pointer;
                font-weight: 600;
            }

        .status {
            text-align: center;
            margin-top: 25px;
            font-size: 13px;
            color: #777;
        }

        .online {
            color: #16803c;
            font-weight: 700;
        }

        footer {
            text-align: center;
            margin-top: 25px;
            color: #888;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            .container {
                padding-top: 20px;
            }

            h1 {
                font-size: 29px;
            }

            .card {
                padding: 18px;
                border-radius: 18px;
            }

            textarea {
                min-height: 130px;
            }

            .answer {
                font-size: 21px;
            }

            .followup {
                flex-direction: column;
            }

                .followup button {
                    width: 100%;
                }
        }
    </style>
</head>

<body>

    <div class="container">

        <header class="header">
            <div class="logo">AI</div>
            <h1>AI Calculator</h1>
            <p class="subtitle">
                Ask your calculation in English, Hindi or Hinglish
            </p>
        </header>

        <main class="card">

            <label for="question">
                What do you want to calculate?
            </label>

            <textarea id="question"
                      placeholder="Example: 25% of 800&#10;Example: 1500 ka 18% GST kitna hoga?&#10;Example: If I save ₹500 every month for 2 years, how much will I have?"></textarea>

            <div class="examples">
                <button class="example" onclick="setExample('25% of 800')">
                    25% of 800
                </button>

                <button class="example" onclick="setExample('1500 ka 18% GST kitna hoga?')">
                    GST Calculation
                </button>

                <button class="example" onclick="setExample('500 × 24')">
                    500 × 24
                </button>

                <button class="example" onclick="setExample('10000 ka 15% kitna hai?')">
                    Percentage
                </button>
            </div>

            <button id="calculateBtn"
                    class="calculate-btn"
                    onclick="calculate()">
                Calculate with AI
            </button>

            <div id="loading" class="loading">
                <span class="spinner"></span>
                Calculating...
            </div>

            <div id="error" class="error"></div>

            <section id="result" class="result">

                <div class="result-title">
                    Result
                </div>

                <div class="answer-box">

                    <div class="answer-label">
                        Answer
                    </div>

                    <div id="answer" class="answer">
                        —
                    </div>

                </div>

                <div class="steps-box">

                    <h3>Step-by-step explanation</h3>

                    <div id="steps" class="steps">
                        —
                    </div>

                </div>

                <div class="actions">

                    <button class="action-btn" onclick="copyResult()">
                        📋 Copy
                    </button>

                    <button class="action-btn" onclick="shareResult()">
                        🔗 Share
                    </button>

                    <button class="action-btn" onclick="clearResult()">
                        ✕ Clear
                    </button>

                </div>

                <div class="followup">

                    <input id="followupInput"
                           type="text"
                           placeholder="Ask a follow-up question..." />

                    <button onclick="sendFollowup()">
                        Send
                    </button>

                </div>

            </section>

            <div class="status">
                Backend:
                <span id="backendStatus">Checking...</span>
            </div>

        </main>

        <footer>
            © 2026 AI Calculator
        </footer>

    </div>


    <script>

        // ==========================================
        // YOUR DEPLOYED RENDER BACKEND
        // ==========================================

        const API_BASE =
        "https://ai-calculator-jvuf.onrender.com";


        // ==========================================
        // ELEMENTS
        // ==========================================

        const questionInput =
        document.getElementById("question");

        const calculateBtn =
        document.getElementById("calculateBtn");

        const loading =
        document.getElementById("loading");

        const errorBox =
        document.getElementById("error");

        const resultBox =
        document.getElementById("result");

        const answerBox =
        document.getElementById("answer");

        const stepsBox =
        document.getElementById("steps");

        const backendStatus =
        document.getElementById("backendStatus");


        // ==========================================
        // CHECK BACKEND
        // ==========================================

        async function checkBackend() {

        try {

        const response =
        await fetch(`${API_BASE}/api/health`);

        if (!response.ok) {
        throw new Error("Backend unavailable");
        }

        const data =
        await response.json();

        if (data.status === "ok") {

        backendStatus.textContent =
        "Online ✓";

        backendStatus.className =
        "online";

        } else {

        backendStatus.textContent =
        "Offline";

        }

        } catch (error) {

        backendStatus.textContent =
        "Offline";

        }

        }


        // ==========================================
        // SET EXAMPLE
        // ==========================================

        function setExample(text) {

        questionInput.value = text;

        questionInput.focus();

        }


        // ==========================================
        // SHOW ERROR
        // ==========================================

        function showError(message) {

        errorBox.textContent = message;

        errorBox.style.display = "block";

        }


        // ==========================================
        // HIDE ERROR
        // ==========================================

        function hideError() {

        errorBox.style.display = "none";

        }


        // ==========================================
        // CALCULATE
        // ==========================================

        async function calculate(customQuestion = null) {

        const question =
        customQuestion ||
        questionInput.value.trim();

        if (!question) {

        showError(
        "Please enter a calculation first."
        );

        questionInput.focus();

        return;

        }

        hideError();

        loading.style.display = "block";

        calculateBtn.disabled = true;

        resultBox.style.display = "none";


        try {

        const response =
        await fetch(`${API_BASE}/api/calculate`, {

        method: "POST",

        headers: {
        "Content-Type": "application/json"
        },

        body: JSON.stringify({
        question: question
        })

        });


        const data =
        await response.json();


        if (!response.ok) {

        throw new Error(
        data.error ||
        data.message ||
        "Calculation failed."
        );

        }


        // ------------------------------------------
        // Handle different possible response names
        // ------------------------------------------

        const answer =
        data.answer ??
        data.result ??
        data.finalAnswer ??
        data.output ??
        "No answer returned.";


        const steps =
        data.steps ??
        data.explanation ??
        data.solution ??
        data.details ??
        "";


        answerBox.textContent =
        formatAnswer(answer);


        stepsBox.textContent =
        formatSteps(steps);


        resultBox.style.display =
        "block";


        // Save latest result
        window.latestResult = {

        question: question,

        answer: formatAnswer(answer),

        steps: formatSteps(steps)

        };


        } catch (error) {

        console.error(error);

        showError(
        error.message ||
        "Something went wrong. Please try again."
        );

        } finally {

        loading.style.display = "none";

        calculateBtn.disabled = false;

        }

        }


        // ==========================================
        // FORMAT ANSWER
        // ==========================================

        function formatAnswer(value) {

        if (typeof value === "object") {

        return JSON.stringify(
        value,
        null,
        2
        );

        }

        return String(value);

        }


        // ==========================================
        // FORMAT STEPS
        // ==========================================

        function formatSteps(value) {

        if (!value) {

        return "No detailed explanation available.";

        }

        if (Array.isArray(value)) {

        return value
        .map((item, index) =>
        `${index + 1}. ${item}`
        )
        .join("\n");

        }

        if (typeof value === "object") {

        return JSON.stringify(
        value,
        null,
        2
        );

        }

        return String(value);

        }


        // ==========================================
        // COPY RESULT
        // ==========================================

        async function copyResult() {

        if (!window.latestResult) return;

        const text =

        `Question:\n${window.latestResult.question}\n\n` +

        `Answer:\n${window.latestResult.answer}\n\n` +

        `Explanation:\n${window.latestResult.steps}`;


        try {

        await navigator.clipboard.writeText(text);

        alert("Result copied successfully ✓");

        } catch (error) {

        alert("Could not copy the result.");

        }

        }


        // ==========================================
        // SHARE RESULT
        // ==========================================

        async function shareResult() {

        if (!window.latestResult) return;


        const text =

        `AI Calculator\n\n` +

        `Question: ${window.latestResult.question}\n\n` +

        `Answer: ${window.latestResult.answer}`;


        if (navigator.share) {

        try {

        await navigator.share({

        title: "AI Calculator Result",

        text: text

        });

        } catch (error) {

        // User cancelled share

        }

        } else {

        try {

        await navigator.clipboard.writeText(text);

        alert(
        "Sharing is not supported here. Result copied instead."
        );

        } catch (error) {

        alert(text);

        }

        }

        }


        // ==========================================
        // CLEAR RESULT
        // ==========================================

        function clearResult() {

        questionInput.value = "";

        answerBox.textContent = "—";

        stepsBox.textContent = "—";

        resultBox.style.display = "none";

        hideError();

        window.latestResult = null;

        questionInput.focus();

        }


        // ==========================================
        // FOLLOW-UP QUESTION
        // ==========================================

        async function sendFollowup() {

        const followupInput =
        document.getElementById("followupInput");

        const followup =
        followupInput.value.trim();


        if (!followup) {

        followupInput.focus();

        return;

        }


        // Combine previous question + follow-up
        const previousQuestion =
        window.latestResult?.question || "";


        const combinedQuestion =

        `Previous question: ${previousQuestion}\n\n` +

        `Previous answer: ${window.latestResult?.answer || ""}\n\n` +

        `Follow-up question: ${followup}`;


        followupInput.value = "";


        await calculate(combinedQuestion);

        }


        // ==========================================
        // ENTER KEY
        // ==========================================

        questionInput.addEventListener(
        "keydown",
        function(event) {

        if (
        event.key === "Enter" &&
        (event.ctrlKey || event.metaKey)
        ) {

        calculate();

        }

        }
        );


        // Follow-up Enter
        document
        .getElementById("followupInput")
        .addEventListener(
        "keydown",
        function(event) {

        if (event.key === "Enter") {

        sendFollowup();

        }

        }
        );


        // ==========================================
        // START
        // ==========================================

        checkBackend();

    </script>

</body>
</html>
